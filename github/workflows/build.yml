name: Build iOS Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Theos & Build
      run: |
        echo "Setting up environment for HAMA VIP iOS..."
        mkdir -p packages
        # دروستکردنی فایلی deb کاتی بە ناوی هاکەکەت
        echo "HAMA-VIP PUBG Global & VNG Hack Package" > packages/HAMA-VIP-iOS.txt
        tar -cvf packages/HAMA-VIP-iOS.tar packages/HAMA-VIP-iOS.txt

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HAMA-VIP-iOS-Package
        path: packages/
