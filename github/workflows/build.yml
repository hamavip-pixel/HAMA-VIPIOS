name: Build iOS Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Deb Package
      run: |
        mkdir -p build_dir/DEBIAN
        mkdir -p build_dir/Library/MobileSubstrate/DynamicLibraries
        
        # گواستنەوەی فایلی دایلیب و لۆگۆ ئەگەر هەبن
        cp -f *.dylib build_dir/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || true
        cp -f *.png build_dir/Library/MobileSubstrate/DynamicLibraries/ 2>/dev/null || true
        
        # دروستکردنی فایلی کۆنتڕۆڵ
        echo "Package: com.hamavip.pubg" > build_dir/DEBIAN/control
        echo "Name: HAMA VIP iOS" >> build_dir/DEBIAN/control
        echo "Version: 1.0.0" >> build_dir/DEBIAN/control
        echo "Architecture: iphoneos-arm" >> build_dir/DEBIAN/control
        echo "Maintainer: HAMA VIP  " >> build_dir/DEBIAN/control
        echo "Description: HAMA VIP Tweak for PUBG Global and VNG" >> build_dir/DEBIAN/control
        echo "Author: HAMA VIP" >> build_dir/DEBIAN/control
        
        # دروستکردنی پاکێجەکە
        sudo apt-get update && sudo apt-get install -y dpkg-dev
        dpkg-deb --build build_dir HAMA-VIP-iOS-Package.deb
        
        mkdir -p final_output
        mv HAMA-VIP-iOS-Package.deb final_output/

    - name: Upload .deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HAMA-VIP-iOS-Package
        path: final_output/*.deb
