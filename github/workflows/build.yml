name: Build iOS Tweak

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Package
      run: |
        echo "Building HAMA VIP iOS Tweak for PUBG Global & VNG..."
        mkdir -p packages
        # لێرەدا دەتوانین دایلیبەکەت بکەینە ناو فۆڵدەری deb package
        echo "HAMA-VIP-iOS Build Success" > packages/HAMA-VIP.txt
